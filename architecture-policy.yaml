version: 1

# 存量模块先标记为 legacy；新模块或完成迁移的模块设置 managed: true。
modules:
  - id: rpc
    roots: [packages/rpc/src]
    managed: false
  - id: shared
    roots: [packages/shared/src]
    managed: false
  - id: provider
    roots: [packages/provider/src]
    managed: false
  - id: provider-node
    roots: [packages/provider-node/src]
    managed: false
  - id: services
    roots: [packages/services/src]
    managed: false
  - id: session
    roots: [packages/services/src/session]
    managed: false
    requires: [shared]
    publicEntrypoints: [packages/services/src/session/contract.ts]
    owner: conversation
  - id: sqlite-migrations
    roots: [packages/shared/src/sqlite-migrations]
    managed: false
    requires: [shared]
    publicEntrypoints: [packages/shared/src/sqlite-migrations/index.ts, packages/shared/src/sqlite-migrations/contract.ts]
    owner: conversation
  - id: project-storage
    roots: [packages/services/src/project-storage]
    managed: false
    requires: [shared, sqlite-migrations, services, session]
    publicEntrypoints: [packages/services/src/project-storage/index.ts, packages/services/src/project-storage/contract.ts, packages/services/src/project-storage/startup.ts, packages/services/src/project-storage/startup-entry.ts]
    owner: conversation
  - id: project
    roots: [packages/services/src/project]
    managed: false
    requires: [shared, project-storage, project-catalog]
    publicEntrypoints: [packages/services/src/project/index.ts, packages/services/src/project/contract.ts]
    owner: conversation
  - id: project-catalog
    roots: [packages/services/src/project-catalog]
    managed: false
    requires: [project, remote-projects]
    publicEntrypoints: [packages/services/src/project-catalog/index.ts, packages/services/src/project-catalog/contract.ts]
    owner: conversation
  - id: remote-projects
    roots: [packages/services/src/remote-projects]
    managed: false
    requires: [shared, project-storage, services]
    publicEntrypoints: [packages/services/src/remote-projects/contract.ts]
    owner: conversation
  - id: task-groups
    roots: [packages/services/src/task-groups]
    managed: false
    requires: [shared, services]
    publicEntrypoints: [packages/services/src/task-groups/index.ts, packages/services/src/task-groups/contract.ts]
    owner: conversation
  - id: task-facts
    roots: [packages/services/src/task-facts]
    managed: false
    requires: [shared, services]
    publicEntrypoints: [packages/services/src/task-facts/index.ts, packages/services/src/task-facts/contract.ts]
    owner: conversation
  - id: project-workspace-navigation
    roots: [packages/services/src/project-workspace-navigation]
    managed: false
    requires: [shared, project, project-catalog, remote-projects]
    publicEntrypoints: [packages/services/src/project-workspace-navigation/index.ts, packages/services/src/project-workspace-navigation/contract.ts]
    owner: conversation
  - id: window-project-directory
    roots: [packages/services/src/window-project-directory]
    managed: false
    requires: [project, remote-projects, rpc, services, shared]
    publicEntrypoints: [packages/services/src/window-project-directory/index.ts, packages/services/src/window-project-directory/contract.ts]
    owner: conversation
  - id: storage
    roots: [packages/services/src/storage]
    managed: true
    requires: [shared, rpc, services]
    publicEntrypoints: [packages/services/src/storage/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: desktop-settings
  - id: client
    roots: [packages/client/src]
    managed: false
  - id: server
    roots: [packages/server/src]
    managed: false
  - id: zcode-server-cli
    roots: [packages/zcode-server-cli/src]
    managed: false
  - id: ui
    roots: [packages/ui/src]
    managed: false
  - id: web
    roots: [packages/web/src]
    managed: false
  - id: desktop
    roots: [packages/desktop/src]
    managed: false
  - id: formal-proof
    roots: [packages/formal-proof/src]
    managed: false
  - id: zcode-cli
    roots: [apps/zcode-cli]
    managed: false

global:
  maxFileLines: 400
  maxContractLines: 300
  maxPublicMethods: 12
  forbidCycles: true
  forbidDeepImports: true
  managedOnly: true

exceptions: []
