# 打 tag（v*）自动构建桌面安装包（macOS / Windows / Linux），并附到 GitHub Release。
#
# 构建入口是仓库自带的聚合脚本 `pnpm --filter @zcode/desktop bundle -- <os> <arch>`，
# 它按 ZCODE_TARGET_OS/ZCODE_TARGET_ARCH 准备平台资产（agent bundle、ripgrep/native-search、
# node-pty prebuild、macOS 窗口边界工具），再跑完整 build 与 electron-builder，
# 最后自带运行时依赖校验和产物体积门禁（audit-bundle-size，超 500MB 会让 job 失败——
# 这是防包体异常膨胀的内置闸门，不要绕过）。
#
# 产物矩阵（ZCODE_ENV=production：正式 ZCode 身份、产物名无 _TEST 后缀）：
#   macos-latest   → mac   arm64（dmg + zip）
#   macos-latest   → mac   x64  （arm64 主机交叉打 x64，Intel runner 已枯竭）
#   windows-latest → win   x64  （nsis exe）
#   ubuntu-latest  → linux x64  （AppImage + deb + rpm + pacman/pkg.tar.zst）
#
# 已知边界：
# - macOS 包为 ad-hoc 签名、未公证（无证书；build job 的 ZCODE_MAC_ADHOC_SIGN=1
#   让 bundle 完整封签，避免未签名产物被 Gatekeeper 判「已损坏」且无法自救）。
#   下载后首次打开仍需右键 → 打开，或系统设置 → 隐私与安全性放行，或
#   `xattr -rd com.apple.quarantine`；彻底解决需要开发者证书 + 公证。
# - GitHub Release 单文件上限 2GiB：超限的产物上传 Release 会被跳过并打 warning，
#   但构建产物始终完整保留在本 run 的 Artifacts 里可下载。
# - linux-arm64 交叉打包未验证过（agent/native 工具链按 targetPlatform.key 准备，
#   理论可行）；需要时往 matrix 加一项并先本地验证 bundle -- linux arm64。
# - CLI 侧 tarball/install.sh 分发链（scripts/zcode-distribution）不在本 workflow
#   范围内，桌面 Electron 是当前唯一目标用户面。

name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: bundle ${{ matrix.target_os }}-${{ matrix.target_arch }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: macos-latest
            target_os: mac
            target_arch: arm64
            # 同一 checkout 双架构并行时用独立 dist 目录隔离（electron-builder.config
            # 的注释明确支持该用法）；单 job 单机虽然用不到，保持配置自洽。
            dist_dir: dist-arm64
          # Intel macOS runner（macos-13）已长期排队枯竭；arm64 主机交叉打 x64
          # 包是上游 config 注释明确的既定模式（prepare 链按 ZCODE_TARGET_ARCH
          # 拉目标架构的 node-pty/bundled-agents 资产）。
          - runs_on: macos-latest
            target_os: mac
            target_arch: x64
            dist_dir: dist-x64
          - runs_on: windows-latest
            target_os: win
            target_arch: x64
            dist_dir: dist
          - runs_on: ubuntu-latest
            target_os: linux
            target_arch: x64
            dist_dir: dist
    env:
      ZCODE_ENV: production
      ZCODE_DESKTOP_DIST_DIR: ${{ matrix.dist_dir }}
      # mac 产物用 ad-hoc 签名完整封签（见 electron-builder.config.js 的
      # ZCODE_MAC_ADHOC_SIGN 注释）：未签名 bundle 被 Gatekeeper 判「已损坏」
      # 且无法自救；ad-hoc 后报错回到可行动的「无法验证开发者」提示。
      # 有证书时 CI 会注入 ZCODE_ENABLE_MAC_SIGN + 证书变量，真实签名优先。
      ZCODE_MAC_ADHOC_SIGN: ${{ matrix.target_os == 'mac' && '1' || '0' }}

    steps:
      - uses: actions/checkout@v4

      # pnpm 版本取根 package.json 的 packageManager 字段（pnpm@10.33.2）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      # rpm 需要 rpmbuild；pacman 的 .pkg.tar.zst 需要 tar + zstd，且 fpm 生成
      # .MTREE 要调 bsdtar（Ubuntu 在 libarchive-tools 包里，缺了会 exit 127）；
      # deb 由 electron-builder 自带的 app-builder/fpm 处理，不需要系统 ruby。
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm zstd xz-utils libarchive-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # bundle 链假设 workspace 各包的 dist/ 已产出（本地由 typecheck 门禁顺手
      # 生成；CI 全新 checkout 没有，直接 bundle 会在 cli 侧 tsc 阶段报
      # "Cannot find module '@zcode/magic-context'"）。这里显式产出两段：
      # 根 tsc -b 覆盖 packages/*，turbo 覆盖 apps/zcode-cli 全部 27 个包。
      - name: Build workspace type outputs
        run: |
          pnpm typecheck
          pnpm exec turbo --cwd apps/zcode-cli run typecheck --force

      - name: Bundle desktop app
        shell: bash
        run: pnpm --filter @zcode/desktop bundle -- ${{ matrix.target_os }} ${{ matrix.target_arch }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target_os }}-${{ matrix.target_arch }}
          # 只收集安装包本体；*-unpacked/、.app 目录和 blockmap/增量文件不上传。
          path: |
            packages/desktop/${{ matrix.dist_dir }}/*.dmg
            packages/desktop/${{ matrix.dist_dir }}/*.zip
            packages/desktop/${{ matrix.dist_dir }}/*.exe
            packages/desktop/${{ matrix.dist_dir }}/*.AppImage
            packages/desktop/${{ matrix.dist_dir }}/*.deb
            packages/desktop/${{ matrix.dist_dir }}/*.rpm
            packages/desktop/${{ matrix.dist_dir }}/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Attach artifacts to GitHub Release
    needs: build
    # 只有 tag 推送才发 Release；workflow_dispatch 手动跑只出 Artifacts 供验证。
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # CHANGELOG.md 的对应版本段落是 Release 正文来源，release job 需要仓库内容。
      - name: Checkout (changelog)
        uses: actions/checkout@v4
        with:
          # tag 事件本身就是产物该对应的提交；只取 CHANGELOG 不需要历史。
          ref: ${{ github.ref }}
          sparse-checkout: |
            CHANGELOG.md

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VER="${TAG#v}"
          # 两种节头都认：`## [1.0.4](compare-url) (date)`（release-it 生成）
          # 与 `## v1.0.3（date）`（早期手写）。取该节到下一个 `## ` 前。
          awk -v ver="$VER" '
            /^## / { grab = (index($0, "[" ver "]") > 0 || index($0, "v" ver "（") > 0) }
            grab { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "notes_file=release-notes.md" >> "$GITHUB_OUTPUT"
          else
            # 该版本在 CHANGELOG 无段落（如 baseline/* tag）：回落 GitHub 自动 notes。
            echo "notes_file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-files
          merge-multiple: true

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          if [ -n "$NOTES_FILE" ]; then
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                   --title "$TAG" --notes-file "$NOTES_FILE" --draft=false
          else
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                   --title "$TAG" --generate-notes --draft=false
          fi

      - name: Upload artifacts (skip >2GiB assets with warning)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -u
          ok=0; skipped=0; failed=0
          while IFS= read -r -d '' f; do
            size=$(( $(stat -c%s "$f") / 1024 / 1024 / 1024 ))
            if [ "$size" -ge 2 ]; then
              echo "::warning::skip $f (≥2GiB, over GitHub Release asset limit; available in run Artifacts)"
              skipped=$((skipped+1)); continue
            fi
            if gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber; then
              ok=$((ok+1))
            else
              echo "::error::failed to upload $f"
              failed=$((failed+1))
            fi
          done < <(find release-files -type f -print0 | sort -z)
          echo "uploaded=$ok skipped=$skipped failed=$failed"
          [ "$failed" -eq 0 ]
